system:
  min_duration: 15
  max_duration: 30
  min_scene_duration: 4
  max_scene_duration: 10
  quality_threshold: 85

youtube_hard_rules:
  profanity:
    blocked_words: ["fuck", "shit", "bitch", "damn", "asshole"]
    action: "BLOCK"
  financial_claims:
    prohibited_phrases: ["guaranteed profit", "risk free", "sure shot", "double your money", "100% returns"]
    action: "BLOCK"
  ai_disclosure:
    required: true
    action: "AUTO_ADD"

models:
  tts: "kokoro"
  image: "flux"

comfyui:
  url: "http://127.0.0.1:8188"          # point this at your own ComfyUI (local or RunPod URL)
  workflow_path: "config/comfyui_workflow.json"   # export from ComfyUI's UI, see README
  positive_prompt_node_id: null          # leave null to auto-detect the first CLIPTextEncode node
  timeout_seconds: 120